$mainMod = SUPER

# ##################################################
# ##  _  __          _                         _  ##
# ## | |/ /___ _   _| |__   ___   __ _ _ __ __| | ##
# ## | ' // _ \ | | | '_ \ / _ \ / _` | '__/ _` | ##
# ## | . \  __/ |_| | |_) | (_) | (_| | | | (_| | ##
# ## |_|\_\___|\__, |_.__/ \___/ \__,_|_|  \__,_| ##
# ##           |___/                              ##
# ##################################################

input {
kb_layout = us
    kb_variant = altgr-intl
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default= true
    follow_mouse = 1

# ####################################################
# ##  _____                _                     _  ##
# ## |_   _|__  _   _  ___| |__  _ __   __ _  __| | ##
# ##   | |/ _ \| | | |/ __| '_ \| '_ \ / _` |/ _` | ##
# ##   | | (_) | |_| | (__| | | | |_) | (_| | (_| | ##
# ##   |_|\___/ \__,_|\___|_| |_| .__/ \__,_|\__,_| ##
# ##                            |_|                 ##
# ####################################################

touchpad {
    natural_scroll = true
    tap-to-click = true
    disable_while_typing = true
}


    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# #######################################
# ## _     _            _              ##
# ##| |__ | |_   _ _ __(_)_ __   __ _  ##
# ##| '_ \| | | | | '__| | '_ \ / _` | ##
# ##| |_) | | |_| | |  | | | | | (_| | ##
# ##|_.__/|_|\__,_|_|  |_|_| |_|\__, | ##
# ##                            |___/  ##
# #######################################

blurls = wofi
blurls = thunar
blurls = gedit
blurls = gtk-layer-shell # for nwg-drawer
blurls = catfish
blurls = nwg-dock
# ##########################################
# ##                         _ _          ##
# ##   ___  _ __   __ _  ___(_) |_ _   _  ##
# ##  / _ \| '_ \ / _` |/ __| | __| | | | ##
# ## | (_) | |_) | (_| | (__| | |_| |_| | ##
# ##  \___/| .__/ \__,_|\___|_|\__|\__, | ##
# ##       |_|                     |___/  ##
# ##########################################

windowrule = opacity 0.85 override 0.85 override,class:thunar
windowrule = opacity 0.85 override 0.85 override,class:gedit
windowrule = opacity 0.85 override 0.85 override,class:catfish
# ###########################################
# ##   __ _             _   _              ##
# ##  / _| | ___   __ _| |_(_)_ __   __ _  ##
# ## | |_| |/ _ \ / _` | __| | '_ \ / _` | ##
# ## |  _| | (_) | (_| | |_| | | | | (_| | ##
# ## |_| |_|\___/ \__,_|\__|_|_| |_|\__, | ##
# ##                                |___/  ##
# ###########################################

#window rules with evaluation
windowrulev2 = opacity 0.85 0.85,floating:1
# ###########################################
# ##   __                               _  ##
# ##  / _| ___   ___ _   _ ___  ___  __| | ##
# ## | |_ / _ \ / __| | | / __|/ _ \/ _` | ##
# ## |  _| (_) | (__| |_| \__ \  __/ (_| | ##
# ## |_|  \___/ \___|\__,_|___/\___|\__,_| ##
# ###########################################

windowrule = stayfocused,class:wofi


# #########################################################
# ##  _____ _                           _           _    ##
# ## |  ___| | __ _ _ __ ___   ___  ___| |__   ___ | |_  ##
# ## | |_  | |/ _` | '_ ` _ \ / _ \/ __| '_ \ / _ \| __| ##
# ## |  _| | | (_| | | | | | |  __/\__ \ | | | (_) | |_  ##
# ## |_|   |_|\__,_|_| |_| |_|\___||___/_| |_|\___/ \__| ##
# #########################################################
# # if someone wants it by heart
# but you can edit the picture with all the features
# in gweenview(KDE image viewer) just same as flameshot
# windowrulev2=move 0 0,title:^(flameshot)
#windowrulev2=nofullscreenrequest,title:^(flameshot)

windowrule = float,class:garuda-assistant
windowrule = float,class:garuda-boot-options
windowrule = float,class:garuda-gamer
windowrule = float,class:garuda-network-assistant
windowrule = float,class:garuda-settings-manager
windowrule = float,class:garuda-welcome

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# #########################################################
# ##     _          _                 _   _              ##
# ##    / \   _ __ (_)_ __ ___   __ _| |_(_) ___  _ __   ##
# ##   / _ \ | '_ \| | '_ ` _ \ / _` | __| |/ _ \| '_ \  ##
# ##  / ___ \| | | | | | | | | | (_| | |_| | (_) | | | | ##
# ## /_/   \_\_| |_|_|_| |_| |_|\__,_|\__|_|\___/|_| |_| ##
# #########################################################

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe_touch = true
}
# #######################################################
# ##  _____                     _   _                  ##
# ## | ____|_  _____  ___ _   _| |_(_) ___  _ __  ___  ##
# ## |  _| \ \/ / _ \/ __| | | | __| |/ _ \| '_ \/ __| ##
# ## | |___ >  <  __/ (__| |_| | |_| | (_) | | | \__ \ ##
# ## |_____/_/\_\___|\___|\__,_|\__|_|\___/|_| |_|___/ ##
# #######################################################

#network applet
exec-once = nm-applet --indicator

#mako(notifications)
exec-once = mako
exec-once =/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# start foot server
exec-once = foot --server

#pre executions (under development)
# exec-once=exec xrdb -load ~/.Xresources

# Clipboard Manager
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Use gtk-settings
exec-once = apply-gsettings

# Install Garuda Hyprland
# bind = $mainMod, I, exec, .local/bin/calamares.sh

